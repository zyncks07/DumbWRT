<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWrt Monitor Dashboard</title>
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/theme.css">
    <script>(function(){try{var t=localStorage.getItem('theme');var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'))}catch(e){}})();</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 100%);
            color: var(--fg);
            min-height: 100vh;
            padding: 12px;
            font-size: 12px;
        }
        
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border-a);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .last-update {
            font-size: 10px;
            color: var(--fg-muted);
            margin-right: 12px;
        }
        
        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-b);
            color: var(--fg);
            padding: 7px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        
        .btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-0);
            transform: translateY(-1px);
        }
        
        /* Compact stats strip — fits the 30-routers-no-scroll target. */
        .stats-strip {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-a);
            border-radius: 10px;
            padding: 8px 18px;
            margin-bottom: 12px;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .stat-pill > i {
            color: var(--fg-muted);
            font-size: 13px;
        }
        .stat-pill-label {
            color: var(--fg-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-pill-value {
            font-weight: 700;
            font-size: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
        }

        /* ---- fleet clients-by-SSID card (§16) ----
           Its own card below the stats strip rather than a panel inside it:
           at strip height the graph was a ~46px ribbon across a 24h window,
           too flat to read a shape from. Full width and ~4x the strip's
           height gives it room for an actual scale. */
        .ssid-card {
            background: var(--card-bg);
            border: 1px solid var(--border-a);
            border-radius: 10px;
            padding: 10px 18px 8px;
            margin-bottom: 12px;
        }
        .ssid-head {
            display: flex;
            align-items: baseline;
            gap: 14px;
            font-size: 10px;
            line-height: 1;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .ssid-title {
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        /* The legend is the SSID graph's "never colour alone" half (§6):
           every series is named here, with its live count. */
        .ssid-legend {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            min-width: 0;
        }
        .ssid-lg {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--fg-muted);
            font-size: 11px;
            max-width: 240px;
        }
        .ssid-lg .nm {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ssid-lg b {
            color: var(--fg);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        .ssid-sw {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            flex: none;
        }
        .ssid-peak {
            margin-left: auto;
            color: var(--fg-muted);
            font-size: 10px;
            white-space: nowrap;
        }

        /* Plot area. The gridlines are absolutely-positioned HTML rather than
           SVG lines because the SVG uses preserveAspectRatio="none" — text
           inside it would be stretched horizontally along with the paths. */
        .ssid-plot {
            position: relative;
            height: 200px;
            padding-left: 34px;   /* gutter for the y labels */
            min-width: 0;
        }
        /* Transparent: the plot ground is painted by .ssid-grid, which is an
           earlier sibling and therefore *behind* this. Giving the SVG its own
           background would hide the gridlines under it. */
        .ssid-spark {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
        }
        .ssid-grid {
            position: absolute;
            inset: 0 0 0 34px;
            background: var(--card-bg-3);
            border-radius: 2px;
            pointer-events: none;
        }
        .ssid-gl {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            border-top: 1px dashed var(--border-b);
            opacity: 0.7;
        }
        .ssid-gl span {
            position: absolute;
            right: calc(100% + 6px);
            top: -0.6em;
            color: var(--fg-muted);
            font-size: 9px;
            font-variant-numeric: tabular-nums;
        }
        .ssid-xaxis {
            display: flex;
            justify-content: space-between;
            margin: 3px 0 0 34px;
            color: var(--fg-muted);
            font-size: 9px;
            font-variant-numeric: tabular-nums;
        }
        .ssid-empty {
            position: absolute;
            inset: 0 0 0 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg-3);
            border-radius: 2px;
            color: var(--fg-muted);
            font-size: 11px;
        }
        /* Same overlay treatment as the per-router client graph: translucent
           fills so a crossing composites to a blend, opaque strokes drawn
           above every fill so each series stays traceable through it. Set in
           CSS rather than as fill=/stroke= attributes because var() is only
           valid in a declaration. */
        .ss-a1 { fill: var(--s1); fill-opacity: 0.20; }
        .ss-a2 { fill: var(--s2); fill-opacity: 0.20; }
        .ss-a3 { fill: var(--s3); fill-opacity: 0.20; }
        .ss-a4 { fill: var(--s4); fill-opacity: 0.20; }
        .ss-l1, .ss-l2, .ss-l3, .ss-l4 {
            fill: none;
            stroke-width: 1.4;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
        }
        .ss-l1 { stroke: var(--s1); }
        .ss-l2 { stroke: var(--s2); }
        .ss-l3 { stroke: var(--s3); }
        .ss-l4 { stroke: var(--s4); }
        .ssid-sw.c1 { background: var(--s1); }
        .ssid-sw.c2 { background: var(--s2); }
        .ssid-sw.c3 { background: var(--s3); }
        .ssid-sw.c4 { background: var(--s4); }

        .interfaces-list {
            padding: 0 16px 12px;
        }
        
        .interface-card {
            background: var(--card-bg-3);
            border: 1px solid var(--border-c);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .interface-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .interface-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-2);
            font-family: 'Courier New', monospace;
        }
        
        .interface-ssid {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg);
        }
        .ssid-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .ssid-badge.active {
            background: rgba(0, 255, 136, 0.15);
            color: var(--ok);
            border: 1px solid var(--accent-2);
        }
        .ssid-badge.disabled {
            background: var(--card-bg-3);
            color: var(--fg-muted);
            border: 1px solid var(--border-c);
        }
        .interface-card.disabled-card {
            opacity: 0.6;
        }
        /* Per-band tint so 2.4 GHz vs 5 GHz radios are distinguishable at a
           glance. Flat color layered over the theme card bg (works light+dark);
           inset stripe reuses the app's band colors (cyan 2.4, green 5). */
        .interface-card.band-24-card {
            background: linear-gradient(rgba(0, 212, 255, 0.06), rgba(0, 212, 255, 0.06)), var(--card-bg-3);
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .interface-card.band-5-card {
            background: linear-gradient(rgba(0, 255, 136, 0.09), rgba(0, 255, 136, 0.09)), var(--card-bg-3);
            box-shadow: inset 3px 0 0 var(--accent-2);
        }

        .interface-meta {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: var(--fg-muted);
            margin-bottom: 10px;
        }
        
        .clients-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }
        
        .clients-table th {
            text-align: left;
            padding: 6px;
            background: var(--border-c);
            color: var(--fg-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 9px;
        }
        
        .clients-table td {
            padding: 8px 6px;
            border-top: 1px solid var(--border-c);
        }
        
        .clients-table tr:hover {
            background: var(--border-d);
        }

        .trusted-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: rgba(0, 255, 136, 0.15);
            color: var(--ok);
            border: 1px solid var(--ok);
        }

        .mac-address {
            font-family: 'Courier New', monospace;
            color: var(--accent);
            font-size: 10px;
        }
        
        .signal-bar {
            display: inline-block;
            width: 50px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            vertical-align: middle;
            margin-right: 6px;
        }
        
        .signal-fill {
            height: 100%;
            border-radius: 3px;
            transition: all 0.3s;
        }
        
        .signal-excellent { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
        .signal-good { background: linear-gradient(90deg, #ffd93d, var(--accent-2)); }
        .signal-fair { background: linear-gradient(90deg, #ffb830, #ffd93d); }
        .signal-poor { background: linear-gradient(90deg, var(--err), #ffb830); }
        
        .rate {
            font-family: 'Courier New', monospace;
            color: var(--fg);
        }
        
        .no-clients {
            text-align: center;
            padding: 20px;
            color: var(--fg-muted);
            font-size: 11px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--fg-muted);
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ---- Dense router table (P4 #16) ---- */
        .router-table {
            background: var(--card-bg);
            border: 1px solid var(--border-a);
            border-radius: 10px;
            overflow: hidden;
        }
        .router-th, .router-tr {
            display: grid;
            /* Spare width goes to the two sparkline columns rather than the
               hostname column, which only ever holds a short name. Traffic
               gave up half its width to the client-count graph. */
            grid-template-columns: 28px minmax(120px, 0.5fr) minmax(96px, 0.75fr) minmax(96px, 0.75fr) 112px 112px 110px 60px 60px 60px 64px 90px 110px 28px;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            font-size: 12px;
        }
        .radio-mini {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .rm-ch {
            background: var(--border-c);
            border-radius: 3px;
            padding: 1px 5px;
            color: var(--fg-muted);
            font-size: 9px;
            font-weight: 600;
        }
        .rm-val { font-weight: 600; }
        /* ---- Uplink bandwidth sparklines (24h) ---- */
        .bw-cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            min-width: 0;
        }
        .bw-row {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 19px;
            min-width: 0;
        }
        /* Icon + colour together, never colour alone. */
        .bw-row i { font-size: 8px; width: 8px; flex: none; }
        .bw-row.in  { color: var(--accent); }
        .bw-row.out { color: var(--accent-2); }
        .bw-spark {
            flex: 1 1 auto;
            min-width: 0;
            height: 17px;
            display: block;
            background: var(--card-bg-3);
            border-radius: 2px;
        }
        .bw-v {
            flex: none;
            width: 56px;
            text-align: right;
            font-size: 9px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--fg-muted);
        }
        /* ---- Associated-client count sparklines (24h) ---- */
        /* Two independent series overlaid, taking the row's full height
           instead of the two 19px bands the bandwidth cell splits into.
           They reuse the exact colours of the .b24/.b5 count columns
           further along the same row, so the graph and the numbers read as
           one thing; the column header carries the text key (§6: never
           colour alone). Neither is a status colour — a client count means
           nothing good or bad. */
        .cl-cell {
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .cl-row {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
            width: 100%;
            min-width: 0;
            color: var(--fg-muted);
        }
        .cl-row i { font-size: 8px; width: 8px; flex: none; }
        .cl-spark {
            flex: 1 1 auto;
            min-width: 0;
            height: 38px;
            display: block;
            background: var(--card-bg-3);
            border-radius: 2px;
        }
        /* The two series overlap rather than stack, so the fills are kept
           light: at 0.2 a crossing composites to a tint that still reads as
           between the two hues, where a heavier fill turns the whole overlap
           into one flat teal mass. Tried and rejected: mix-blend-mode:screen,
           which is brighter but merges the hues further — and costs
           compositing work on every row (§6, Atom CPU).
           Filled via CSS rather than a fill= attribute so they follow the
           theme — var() is not valid in a presentation attribute, only in a
           declaration. */
        .cl-a24 { fill: var(--accent);   fill-opacity: 0.20; }
        .cl-a5  { fill: var(--accent-2); fill-opacity: 0.20; }
        /* The strokes are what keep each series readable through an
           overlap: full opacity, and drawn above every fill, so each line
           can always be traced across the crossings. */
        .cl-l24, .cl-l5, .cl-edge {
            fill: none;
            stroke-width: 1.25;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
        }
        .cl-l24 { stroke: var(--accent); }
        .cl-l5  { stroke: var(--accent-2); }
        /* Migration-only: the total, for buckets whose split predates the
           per-band columns. Neutral, and never drawn where the two bands
           are, so the graph is only ever two series at any given x. */
        .cl-edge { stroke: var(--fg-muted); stroke-opacity: 0.8; }
        /* Column-header key for the two band colours. */
        .cl-key {
            white-space: nowrap;
            font-weight: 400;
            font-size: 9px;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.85;
        }
        .cl-key b {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 1px;
            margin: 0 2px 0 4px;
            vertical-align: baseline;
        }
        .cl-key .k24 { background: var(--accent); }
        .cl-key .k5  { background: var(--accent-2); }
        .cl-v {
            flex: none;
            width: 24px;
            text-align: right;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--fg);
        }
        .reach-strip {
            height: 14px;
            border-radius: 3px;
            overflow: hidden;
            background: var(--card-bg-3);
            display: flex;
            width: 100%;
        }
        .reach-strip .seg.online  { background: var(--ok); }
        .reach-strip .seg.offline { background: var(--err); opacity: 0.85; }
        .router-th {
            height: 32px;
            color: var(--fg-muted);
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-a);
            background: var(--card-bg-3);
        }
        .router-th .num { text-align: center; }
        .router-tr {
            /* 48px, not the original 36px: the row has to fit the two
               stacked bandwidth sparklines. */
            height: 48px;
            border-bottom: 1px solid var(--border-d);
            cursor: pointer;
            transition: background 0.1s;
        }
        .router-tr:hover { background: var(--border-d); }
        .router-tr.offline { opacity: 0.55; }
        .router-tr .dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 6px var(--ok);
        }
        .router-tr.offline .dot {
            background: var(--err);
            box-shadow: none;
        }
        .router-tr .hostname {
            font-weight: 600;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .router-tr .ip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--fg-muted);
        }
        .router-tr .num {
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .router-tr .b24 { color: var(--accent); }
        .router-tr .b5  { color: var(--accent-2); }
        .router-tr .upt { font-size: 11px; color: var(--fg-muted); }
        .router-tr .ch {
            color: var(--fg-muted);
            font-size: 10px;
            transition: transform 0.15s;
            justify-self: end;
        }
        .router-tr.expanded .ch {
            transform: rotate(90deg);
            color: var(--accent);
        }
        /* Drop-down animation: the panel is always in the DOM as a CSS grid
           whose single row animates 0fr -> 1fr, sliding open to the exact
           content height with no JS. The inner wrapper is clipped while the
           row is collapsed. Runs only on user click, not on data polls. */
        .router-detail {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.24s ease;
        }
        .router-detail.expanded { grid-template-rows: 1fr; }
        .router-detail-inner {
            overflow: hidden;
            min-height: 0;
            padding: 12px 16px;
            background: var(--card-bg-2);
            border-bottom: 1px solid var(--border-a);
        }
        @media (prefers-reduced-motion: reduce) {
            .router-detail { transition: none; }
        }

        /* ---- Radio health metrics strip (per interface card) ---- */
        .radio-metrics {
            display: flex;
            background: var(--card-bg-2);
            border: 1px solid var(--border-c);
            border-radius: 5px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .radio-metric {
            flex: 1;
            padding: 6px 10px;
            border-right: 1px solid var(--border-c);
            min-width: 0;
        }
        .radio-metric:last-child { border-right: none; }
        .radio-metric-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--fg-muted);
            margin-bottom: 3px;
            font-weight: 600;
        }
        .radio-metric-value {
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--fg);
        }
        .radio-metric-bar {
            height: 3px;
            background: var(--border-d);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .radio-metric-fill { height: 100%; border-radius: 2px; }
        .m-ok   { color: var(--ok); }
        .m-warn { color: var(--warn); }
        .m-err  { color: var(--err); }
        .radio-metric-fill.m-ok   { background: var(--ok); }
        .radio-metric-fill.m-warn { background: var(--warn); }
        .radio-metric-fill.m-err  { background: var(--err); }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <i class="fas fa-network-wired"></i>
            OpenWrt Monitor
        </h1>
        <div class="header-actions">
            <div class="last-update" id="lastUpdate">Last update: Never</div>
            <a href="/clients" class="btn">
                <i class="fas fa-users"></i>
                Clients
            </a>
            <a href="/logs" class="btn">
                <i class="fas fa-terminal"></i>
                Logs
            </a>
            <a href="/config" class="btn">
                <i class="fas fa-cog"></i>
                Settings
            </a>
            <a href="/maintenance" class="btn">
                <i class="fas fa-database"></i>
                Maintenance
            </a>
            <a href="/security" class="btn">
                <i class="fas fa-shield-alt"></i>
                Security
            </a>
            <button id="themeToggle" class="btn" title="Toggle theme" aria-label="Toggle theme"></button>
            <a href="/logout" class="btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </div>
    </div>

    <div class="stats-strip">
        <div class="stat-pill">
            <i class="fas fa-router"></i>
            <span class="stat-pill-label">Routers</span>
            <span class="stat-pill-value"><span id="onlineRouters">0</span> / <span id="totalRouters">0</span></span>
        </div>
        <div class="stat-pill">
            <i class="fas fa-wifi"></i>
            <span class="stat-pill-label">Interfaces</span>
            <span class="stat-pill-value" id="totalInterfaces">0</span>
        </div>
        <div class="stat-pill">
            <i class="fas fa-users"></i>
            <span class="stat-pill-label">Clients</span>
            <span class="stat-pill-value" id="totalClients">0</span>
        </div>
        <div class="stat-pill">
            <i class="fas fa-signal"></i>
            <span class="stat-pill-label">2.4 GHz</span>
            <span class="stat-pill-value" id="clients24">0</span>
        </div>
        <div class="stat-pill">
            <i class="fas fa-signal"></i>
            <span class="stat-pill-label">5 GHz</span>
            <span class="stat-pill-value" id="clients5">0</span>
        </div>
    </div>

    <div class="ssid-card" id="ssidCard">
        <div class="ssid-head">
            <span class="ssid-title">Clients by SSID · 24h</span>
            <span class="ssid-legend" id="ssidLegend"></span>
            <span class="ssid-peak" id="ssidPeak"></span>
        </div>
        <div class="ssid-plot" id="ssidPlot">
            <div class="ssid-grid" id="ssidGrid"></div>
            <div class="ssid-empty">no data yet</div>
        </div>
        <div class="ssid-xaxis" id="ssidXaxis"></div>
    </div>

    <div class="router-table" id="routersTable">
        <div class="loading" style="padding:30px">
            <div class="spinner"></div>
            <div>Loading router data...</div>
        </div>
    </div>

    <script>
        let expandedRouters = new Set();
        let currentRouterData = {}; // Cache to prevent unnecessary re-renders
        let reachData = {};
        let reachWindow = 86400;

        function renderReachStrip(segments, windowSec) {
            if (!segments || !segments.length) return '<div class="reach-strip"></div>';
            const parts = segments.map(s => {
                const [start, end, online] = s;
                const w = ((end - start) / windowSec * 100).toFixed(3);
                const cls = online ? 'online' : 'offline';
                return `<div class="seg ${cls}" style="width:${w}%"></div>`;
            }).join('');
            return `<div class="reach-strip">${parts}</div>`;
        }

        /* ---- Uplink bandwidth + client-count sparklines ---- */
        let bwData = {};
        let bwBuckets = 240;
        let bwWindowHours = 24;
        let bwIntervalSec = 360;
        // Client graphs share ONE scale across the whole fleet, unlike the
        // bandwidth graphs (which scale per row, because bit/s spans orders of
        // magnitude between APs). Client counts all sit in the same small
        // range, so a shared scale makes the rows directly comparable — which
        // is the whole reason to put the graph in a fleet table. The floor
        // stops a one-client fleet from drawing full-height blocks.
        //
        // `peak_clients` is the peak of what is actually drawn (the larger of
        // the two bands, or the total on migration-era buckets that have no
        // split), NOT the peak total — the series are overlaid, so scaling to
        // a total nothing draws would waste half the height.
        const CL_MIN_SCALE = 4;
        let clPeak = CL_MIN_SCALE;

        // ---- fleet clients-by-SSID graph (§16) ----
        // Colour is assigned by position in ssidOrder, and the order is
        // ALPHABETICAL rather than by traffic. An ops console is watched
        // daily, so "LASKIE Hotspot is the cyan one" has to hold across
        // reloads — ranking by clients would reshuffle the colours whenever
        // two networks traded places, and the two feeds here (live counts
        // from /api/stats, history from /api/bandwidth) don't even agree on
        // an order at the same instant. Sorting by name is the only rule
        // that gives the same answer in every browser on every load.
        //
        // Both feeds contribute names: /api/stats is live and has SSIDs on a
        // fresh install before any history exists; /api/ssid-clients has
        // SSIDs with history but no clients right now.
        const SSID_COLORS = 4;         // matches --s1..--s4 and .ss-a/.ss-l
        const SSID_MIN_SCALE = 4;      // floor, as for the per-router graph
        // viewBox height for the plot. Matches .ssid-plot's CSS height so the
        // path geometry is 1:1 with pixels — the SVG is preserveAspectRatio
        // ="none", so any other value would silently scale y against x.
        const SSID_PLOT_H = 200;
        let ssidOrder = [];
        let ssidSeries = {};
        let ssidBuckets = 0;
        let ssidIntervalSec = 120;
        let ssidWindowHours = 24;
        let ssidPeak = SSID_MIN_SCALE;
        let ssidPeakTotal = 0;
        let ssidLive = {};

        // Returns true when the set changed, so only a real change repaints.
        // The API has already capped what it sends to the busiest few; this
        // cap is the local backstop for the union of the two feeds.
        function ssidTrack(names) {
            const before = ssidOrder.join('\u0000');
            const set = new Set(ssidOrder);
            (names || []).forEach(n => { if (n) set.add(n); });
            ssidOrder = Array.from(set).sort().slice(0, SSID_COLORS);
            return ssidOrder.join('\u0000') !== before;
        }

        // Bare magnitude, for the tooltip where "bps" is spelled out once.
        function fmtBps(bps) {
            if (bps == null) return '—';
            if (bps >= 1e9) return (bps / 1e9).toFixed(1) + 'G';
            if (bps >= 1e6) return (bps / 1e6).toFixed(bps >= 1e7 ? 0 : 1) + 'M';
            if (bps >= 1e3) return Math.round(bps / 1e3) + 'K';
            return Math.round(bps) + '';
        }

        // Cell label — carries the unit so "42M" can't be read as bytes.
        function fmtBpsLabel(bps) {
            return bps == null ? '—' : fmtBps(bps) + 'bps';
        }

        // Hand-rolled SVG — no chart library (§6). One filled path per run of
        // consecutive samples, so an offline gap renders as a gap.
        //
        // The y-scale is square root, not linear: IN and OUT share one peak
        // so they stay comparable to each other, but OUT runs ~10-20% of IN
        // on these APs and a linear shared scale flatlines it into a useless
        // line. sqrt keeps the ordering (OUT still visibly smaller) while
        // giving it shape; exact magnitudes are the job of the number beside
        // the graph. sparkOverlay below is the client-count counterpart, and
        // is linear because a small integer gauge needs no such compression.
        function sparkPath(points, max) {
            const n = points.length;
            const H = 17;
            const top = max > 0 ? Math.sqrt(max) : 0;
            const scale = top > 0 ? (H - 1) / top : 0;
            const y = v => +(H - 0.5 - Math.sqrt(v) * scale).toFixed(2);
            let body = '';
            let run = [];
            const flush = () => {
                if (!run.length) return;
                // Single orphan sample: a 1-unit-wide bar, since a one-point
                // path would draw nothing.
                if (run.length === 1) {
                    const [i, v] = run[0];
                    body += `<rect x="${i}" y="${y(v)}" width="1" height="${+(H - y(v)).toFixed(2)}" fill-opacity="0.55"/>`;
                } else {
                    const line = run.map(([i, v], k) => `${k ? 'L' : 'M'}${i} ${y(v)}`).join('');
                    // Area first, then the top edge on its own path, so the
                    // baseline and the vertical closing edges aren't stroked.
                    body += `<path d="${line}L${run[run.length - 1][0]} ${H}L${run[0][0]} ${H}Z" fill-opacity="0.55"/>`;
                    body += `<path d="${line}" fill="none" stroke="currentColor" stroke-width="1"
                                   stroke-opacity="0.95" stroke-linejoin="round"
                                   vector-effect="non-scaling-stroke"/>`;
                }
                run = [];
            };
            for (let i = 0; i < n; i++) {
                if (points[i] == null) { flush(); continue; }
                run.push([i, points[i]]);
            }
            flush();
            // preserveAspectRatio=none stretches the 240-unit-wide viewBox to
            // whatever the column gives us; non-scaling-stroke above keeps the
            // line 1px despite that anisotropic scale.
            return `<svg class="bw-spark" viewBox="0 0 ${n} ${H}" preserveAspectRatio="none"
                         fill="currentColor" stroke="none">${body}</svg>`;
        }

        // Runs of consecutive bucket indices passing `ok`, so each run can
        // become one path and the buckets between them stay gaps.
        function runsOf(n, ok) {
            const out = [];
            let run = [];
            for (let i = 0; i < n; i++) {
                if (ok(i)) run.push(i);
                else if (run.length) { out.push(run); run = []; }
            }
            if (run.length) out.push(run);
            return out;
        }

        // Overlay variant of sparkPath for the client graph: each series is
        // its own area-from-baseline plus a line, drawn on one shared scale
        // so 2.4G and 5G can be compared directly. Deliberately NOT stacked —
        // stacking moves the upper band's baseline, which is exactly what
        // makes "which radio is carrying more right now" hard to read.
        //
        // The two survive overlapping because of the draw order: every fill
        // first, then every line. The fills are translucent enough that a
        // crossing composites to a blend of the two hues, and the lines above
        // them are opaque, so each series stays traceable through it.
        //
        // Linear on the shared fleet scale — see sparkPath's notes on why the
        // bandwidth graph is the one that needs sqrt.
        //
        // Each entry is {points, area, line}; `area` may be omitted for a
        // line-only series (the migration-era total, which has no split to
        // shade and never coexists with the bands at the same x).
        function sparkOverlay(series, max, opts) {
            const n = (opts && opts.n) || 0;
            const H = (opts && opts.height) || 38;
            const cls = (opts && opts.cls) || 'cl-spark';
            const scale = max > 0 ? (H - 1) / max : 0;
            const y = v => +(H - 0.5 - v * scale).toFixed(2);

            let areas = '', lines = '';
            series.forEach(sr => {
                const pts = sr.points || [];
                runsOf(n, i => pts[i] != null).forEach(run => {
                    // A lone sample gets a 1-unit tick / bar; a one-point
                    // path would draw nothing.
                    if (run.length === 1) {
                        const i = run[0], yv = y(pts[i]);
                        if (sr.area) {
                            const h = +(H - yv).toFixed(2);
                            if (h > 0.01) areas += `<rect class="${sr.area}" x="${i}" y="${yv}" width="1" height="${h}"/>`;
                        }
                        lines += `<path class="${sr.line}" d="M${i} ${yv}L${i + 1} ${yv}"/>`;
                        return;
                    }
                    const d = run.map((i, k) => `${k ? 'L' : 'M'}${i} ${y(pts[i])}`).join('');
                    if (sr.area) {
                        // Area closed down to the baseline; the line is a
                        // separate path so the closing edges aren't stroked.
                        areas += `<path class="${sr.area}" d="${d}L${run[run.length - 1]} ${H}L${run[0]} ${H}Z"/>`;
                    }
                    lines += `<path class="${sr.line}" d="${d}"/>`;
                });
            });

            return `<svg class="${cls}" viewBox="0 0 ${n} ${H}" preserveAspectRatio="none">${areas}${lines}</svg>`;
        }

        // Nice round gridline step for a max: 1/2/5 x 10^n, aiming for
        // roughly `target` lines. Keeps the y labels whole client counts.
        // Thresholds are the classic 1.5/3/7 midpoints, not 1/2/5 — rounding
        // at the value itself always rounds up, so a max of 27 over 4 lines
        // would jump to a step of 10 and draw two gridlines instead of five.
        function niceStep(max, target) {
            const raw = max / Math.max(1, target);
            const pow = Math.pow(10, Math.floor(Math.log10(raw)));
            const n = raw / pow;
            return Math.max(1, (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * pow);
        }

        // The fleet graph: one overlaid series per SSID, on the same shared
        // linear scale, drawn by the same sparkOverlay as the per-router
        // client graph. Shared scale is the whole point — the question is
        // which network is carrying the fleet, and per-series auto-scaling
        // would draw a 2-client SSID and a 19-client one identically.
        //
        // Scaled to the largest single SSID, not the fleet total: the series
        // are overlaid rather than stacked (§15), so the total is never drawn
        // and scaling to it would waste most of the height. The total is
        // stated beside the legend instead.
        function renderSsidGraph() {
            const plot = document.getElementById('ssidPlot');
            const grid = document.getElementById('ssidGrid');
            const xax = document.getElementById('ssidXaxis');
            const pk = document.getElementById('ssidPeak');
            if (!plot) return;

            const names = ssidOrder.filter(n => (ssidSeries[n] || []).some(v => v != null));
            const old = plot.querySelector('.ssid-spark, .ssid-empty');
            if (!names.length || !ssidBuckets) {
                if (old) old.outerHTML = '<div class="ssid-empty">no data yet</div>';
                if (grid) grid.innerHTML = '';
                if (xax) xax.innerHTML = '';
                if (pk) pk.textContent = '';
                plot.removeAttribute('title');
                return;
            }

            const max = Math.max(ssidPeak, SSID_MIN_SCALE);
            const svg = sparkOverlay(
                names.map(n => {
                    const i = ssidOrder.indexOf(n) + 1;
                    return {points: ssidSeries[n], area: `ss-a${i}`, line: `ss-l${i}`};
                }),
                max, {n: ssidBuckets, height: SSID_PLOT_H, cls: 'ssid-spark'});
            // Replace the plot's own child, not the whole container — the
            // gridline layer is a sibling and must survive the repaint.
            if (old) old.outerHTML = svg; else plot.insertAdjacentHTML('beforeend', svg);

            // Gridlines, bottom-up, at whole-client steps. The 0 line is the
            // baseline the areas already sit on, so it is skipped.
            if (grid) {
                const step = niceStep(max, 4);
                let g = '';
                for (let v = step; v <= max; v += step) {
                    g += `<div class="ssid-gl" style="top:${(100 * (1 - v / max)).toFixed(3)}%">`
                       + `<span>${v}</span></div>`;
                }
                grid.innerHTML = g;
            }

            // Time axis: one label per 6h, oldest on the left.
            if (xax) {
                const span = ssidWindowHours;
                const marks = [];
                for (let h = span; h > 0; h -= 6) marks.push(`-${h}h`);
                marks.push('now');
                xax.innerHTML = marks.map(m => `<span>${m}</span>`).join('');
            }

            if (pk) {
                pk.textContent = `peak ${ssidPeakTotal} total`
                    + ` · ${Math.round(ssidIntervalSec / 60)}-min avg`;
            }
            plot.title = `Associated clients per SSID, last ${ssidWindowHours}h`
                       + ` · ${Math.round(ssidIntervalSec / 60)}-minute average`
                       + ` · ${ssidBuckets} points`
                       + ` · scale 0–${max} (busiest single SSID)`
                       + ` · fleet peak ${ssidPeakTotal}`;
        }

        // Legend doubles as the colour key (§6: never colour alone). The
        // count is the live one from /api/stats on the 10s cadence, not the
        // graph's last bucket, which is up to one bucket period stale.
        function renderSsidLegend() {
            const el = document.getElementById('ssidLegend');
            if (!el) return;
            el.innerHTML = ssidOrder.map((n, i) =>
                `<span class="ssid-lg" title="${vEsc(n)}">`
                + `<i class="ssid-sw c${i + 1}"></i>`
                + `<span class="nm">${vEsc(n)}</span>`
                + `<b>${ssidLive[n] != null ? ssidLive[n] : 0}</b></span>`
            ).join('');
        }

        function bwRows(ip, router) {
            const d = bwData[ip];
            const empty = new Array(d ? d.in.length : bwBuckets).fill(null);
            const inPts = d ? d.in : empty;
            const outPts = d ? d.out : empty;
            // IN and OUT share the router's peak so the two are comparable
            // to each other within a row.
            const peak = d ? d.peak : 0;
            // Live rate comes from /api/routers (10s); the sparkline itself
            // only advances once per bucket.
            const liveIn = liveBps(router, 'bw_in_bps');
            const liveOut = liveBps(router, 'bw_out_bps');
            return `
                <div class="bw-row in"><i class="fas fa-arrow-down"></i>${sparkPath(inPts, peak)}<span class="bw-v">${fmtBpsLabel(liveIn)}</span></div>
                <div class="bw-row out"><i class="fas fa-arrow-up"></i>${sparkPath(outPts, peak)}<span class="bw-v">${fmtBpsLabel(liveOut)}</span></div>`;
        }

        // Associated clients over the same window and the same buckets as
        // the traffic graph, on the shared fleet scale: 2.4G and 5G as two
        // overlaid series so the two radios can be compared directly.
        function clRow(ip, router) {
            const d = bwData[ip];
            const empty = new Array(bwBuckets).fill(null);
            const total = (d && d.clients) || empty;
            const c24 = (d && d.clients_24) || empty;
            const c5 = (d && d.clients_5) || empty;
            const n = total.length;
            // Buckets predating the per-band columns know the total but not
            // the split. Drawing the total there — and only there — keeps
            // them from vanishing without ever putting a third series on top
            // of the two bands.
            const preSplit = total.map(
                (v, i) => (c24[i] == null || c5[i] == null) ? v : null);
            const live = router ? (router.total_clients || 0) : 0;
            return `<div class="cl-row"><i class="fas fa-users"></i>`
                 + sparkOverlay([
                       {points: c24, area: 'cl-a24', line: 'cl-l24'},
                       {points: c5,  area: 'cl-a5',  line: 'cl-l5'},
                       {points: preSplit, line: 'cl-edge'},
                   ], clPeak, {n: n, height: 38, cls: 'cl-spark'})
                 + `<span class="cl-v">${live}</span></div>`;
        }

        function clTitle(ip, router) {
            const d = bwData[ip];
            return `associated clients · last ${bwWindowHours}h`
                 + ` · 2.4G and 5G overlaid, not stacked`
                 + ` · peak total ${d ? (d.peak_total || 0) : 0}`
                 + ` · now ${router ? (router.total_clients || 0) : 0}`
                 + ` (2.4G ${router ? (router.clients_24 || 0) : 0}`
                 + ` / 5G ${router ? (router.clients_5 || 0) : 0})`
                 + ` · scale 0-${clPeak} (shared by every router)`;
        }

        function paintCl(ip, router) {
            const cell = document.getElementById(`cl-${ip.replace(/\./g, '_')}`);
            if (!cell) return;
            cell.innerHTML = clRow(ip, router);
            cell.title = clTitle(ip, router);
        }

        // How the collector picked the uplink port, spelled out so a
        // mis-detection is visible from the dashboard alone.
        const BW_SRC = {
            gateway:  'gateway path',
            override: 'config override',
            traffic:  'busiest port — gateway not seen on a wired port',
            none:     'no wired bridge port',
        };

        function bwTitle(ip, router) {
            const d = bwData[ip];
            const uplink = (router && router.bw_uplink) || (d && d.uplink) || '?';
            const src = (router && router.bw_uplink_src) || (d && d.src);
            const how = BW_SRC[src] ? ` (${BW_SRC[src]})` : '';
            return `uplink ${String(uplink).replace(/"/g, '')}${how}`
                 + ` · last ${bwWindowHours}h`
                 + ` · peak ${fmtBps(d ? d.peak : 0)}bps`
                 + ` · now in ${fmtBps(liveBps(router, 'bw_in_bps'))}`
                 + ` / out ${fmtBps(liveBps(router, 'bw_out_bps'))}`;
        }

        function paintBw(ip, router) {
            const cell = document.getElementById(`bw-${ip.replace(/\./g, '_')}`);
            if (!cell) return;
            cell.innerHTML = bwRows(ip, router);
            cell.title = bwTitle(ip, router);
        }

        // No client-side clock arithmetic here on purpose: the collector
        // nulls these columns in mark_offline(), and every poll either
        // succeeds or marks the router offline, so `online` is the whole
        // freshness test — and it can't be skewed by the browser's clock.
        function liveBps(router, key) {
            if (!router || router.online !== 1) return null;
            return router[key] != null ? router[key] : null;
        }

        async function fetchBandwidth() {
            try {
                const r = await fetch('/api/bandwidth');
                const d = await r.json();
                if (!d.success) return;
                bwData = d.routers || {};
                bwBuckets = d.buckets || bwBuckets;
                bwWindowHours = d.window_hours || bwWindowHours;
                bwIntervalSec = d.interval || bwIntervalSec;
                clPeak = Object.values(bwData).reduce(
                    (m, r) => Math.max(m, r.peak_clients || 0), CL_MIN_SCALE);
                Object.keys(bwData).forEach(ip => {
                    paintBw(ip, currentRouterData[ip]);
                    paintCl(ip, currentRouterData[ip]);
                });
            } catch (e) {
                console.error('bandwidth fetch failed', e);
            }
        }

        async function fetchSsidClients() {
            try {
                const r = await fetch('/api/ssid-clients');
                const d = await r.json();
                if (!d.success) return;
                ssidSeries = d.series || {};
                ssidBuckets = d.buckets || 0;
                ssidIntervalSec = d.interval || ssidIntervalSec;
                ssidWindowHours = d.window_hours || ssidWindowHours;
                ssidPeak = d.peak || 0;
                ssidPeakTotal = d.peak_total || 0;
                if (ssidTrack(d.names)) renderSsidLegend();
                renderSsidGraph();
            } catch (e) {
                console.error('ssid-clients fetch failed', e);
            }
        }

        async function fetchReachability() {
            try {
                const r = await fetch('/api/reachability');
                const d = await r.json();
                if (!d.success) return;
                reachData = d.routers || {};
                reachWindow = d.window_seconds || 86400;
                Object.keys(reachData).forEach(ip => {
                    const safeIP = ip.replace(/\./g, '_');
                    const cell = document.getElementById(`reach-${safeIP}`);
                    if (cell) cell.innerHTML = renderReachStrip(reachData[ip], reachWindow);
                });
            } catch (e) {
                console.error('reachability fetch failed', e);
            }
        }

        function getSignalClass(signal) {
            if (signal >= -50) return 'signal-excellent';
            if (signal >= -60) return 'signal-good';
            if (signal >= -70) return 'signal-fair';
            return 'signal-poor';
        }

        function getSignalPercent(signal) {
            const percent = Math.max(0, Math.min(100, ((signal + 90) / 60) * 100));
            return percent;
        }

        function formatRate(rate) {
            if (!rate || rate === 0) return '-';
            if (rate >= 1000) return (rate / 1000).toFixed(1) + ' Gbps';
            return rate + ' Mbps';
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatTime(seconds) {
            if (!seconds) return '0s';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${h}h ${m}m`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        // ---- captive-portal voucher helpers (mirror templates/clients.html) ----
        function hasVoucher(c) {
            if (!c.voucher_code) return false;
            const m = (c.voucher_authmethod || '').toLowerCase();
            return m === '' || m.includes('voucher');
        }
        function fmtVoucherClock(unixSec) {
            if (!unixSec) return '—';
            const d = new Date(unixSec * 1000);
            return d.toLocaleString([], { month: 'short', day: 'numeric',
                                          hour: '2-digit', minute: '2-digit' });
        }
        // Remaining time until expiry (allow_time + session_timeout), derived
        // live. Green > 30 min, amber under 30 min, red once expired.
        function fmtVoucherRemaining(expiryUnix) {
            if (!expiryUnix) return { text: '—', color: 'var(--fg-muted)' };
            const rem = expiryUnix - Date.now() / 1000;
            if (rem <= 0) return { text: 'expired', color: 'var(--err)' };
            const color = rem > 1800 ? 'var(--ok)' : 'var(--warn)';
            const h = Math.floor(rem / 3600);
            const m = Math.floor((rem % 3600) / 60);
            return { text: (h > 0 ? `${h}h ${m}m` : `${m}m`) + ' left', color };
        }
        // Time since captive-portal last activity (server voucher_last_activity).
        function fmtVoucherActivity(unixSec) {
            if (!unixSec) return { text: '—', color: 'var(--fg-muted)' };
            const d = Math.max(0, Math.floor(Date.now() / 1000 - unixSec));
            let text;
            if (d < 60) text = d + 's ago';
            else if (d < 3600) text = Math.floor(d / 60) + 'm ago';
            else text = Math.floor(d / 3600) + 'h ' + Math.floor((d % 3600) / 60) + 'm ago';
            const color = d < 120 ? 'var(--ok)' : (d < 1800 ? 'var(--fg-muted)' : 'var(--warn)');
            return { text, color };
        }
        function vEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function voucherCell(c) {
            if (!hasVoucher(c)) {
                if (c.trusted) {
                    return `<span class="trusted-badge">TRUSTED</span>`
                         + (c.trusted_descr ? `<div style="color:var(--fg-muted);font-size:0.85em">${vEsc(c.trusted_descr)}</div>` : '');
                }
                return '<span style="color:var(--fg-muted)">—</span>';
            }
            const rem = fmtVoucherRemaining(c.voucher_expiry);
            const act = fmtVoucherActivity(c.voucher_last_activity);
            return `<div style="font-family:'JetBrains Mono',monospace;font-weight:600" data-copy="${c.voucher_code}" data-copy-label="Voucher">${c.voucher_code}</div>`
                 + `<div style="color:var(--fg-muted);font-size:0.85em">since ${fmtVoucherClock(c.voucher_start)}</div>`
                 + `<div style="color:${rem.color};font-size:0.85em">${rem.text}</div>`
                 + `<div style="color:${act.color};font-size:0.85em">active ${act.text}</div>`;
        }

        function toggleRouter(routerIp) {
            const safeIP = routerIp.replace(/\./g, '_');
            const row = document.getElementById(`router-row-${safeIP}`);
            const detail = document.getElementById(`router-detail-${safeIP}`);
            if (!row || !detail) return;
            if (expandedRouters.has(routerIp)) {
                expandedRouters.delete(routerIp);
                row.classList.remove('expanded');
                detail.classList.remove('expanded');
            } else {
                expandedRouters.add(routerIp);
                row.classList.add('expanded');
                detail.classList.add('expanded');
                loadRouterDetails(routerIp);
            }
        }

        function setText(parent, sel, value) {
            const el = parent.querySelector(sel);
            if (el && el.textContent !== String(value)) el.textContent = value;
        }

        function fmtLoad(v) { return (v != null) ? Number(v).toFixed(2) : '—'; }
        function fmtUptime(s) { return s ? formatTime(s) : '—'; }

        /* ---- Radio health helpers ---- */
        function noiseClass(n) {
            if (n == null) return '';
            return n <= -90 ? 'm-ok' : n <= -80 ? 'm-warn' : 'm-err';
        }
        function snrClass(snr) {
            if (snr == null) return '';
            return snr >= 35 ? 'm-ok' : snr >= 20 ? 'm-warn' : 'm-err';
        }
        function bitrateClass(kbps) {
            if (!kbps) return '';
            return kbps >= 300000 ? 'm-ok' : kbps >= 54000 ? 'm-warn' : 'm-err';
        }
        function fmtKbps(kbps) {
            if (!kbps) return '—';
            const m = kbps / 1000;
            return m >= 1000 ? (m / 1000).toFixed(1) + ' Gbps' : Math.round(m) + ' Mbps';
        }
        function fmtKbpsShort(kbps) {
            if (!kbps) return '—';
            const m = kbps / 1000;
            return m >= 1000 ? (m / 1000).toFixed(1) + 'G' : Math.round(m) + 'M';
        }
        function fmtRadioMini(ch, noise, kbps) {
            if (ch == null && noise == null && !kbps)
                return '<span style="color:var(--fg-muted);font-size:10px">—</span>';
            const nc = noiseClass(noise);
            const bc = bitrateClass(kbps);
            return '<div class="radio-mini">'
                + (ch    != null ? `<span class="rm-ch">${ch}</span>` : '')
                + (noise != null ? `<span class="rm-val ${nc}">${noise}</span>` : '')
                + (kbps          ? `<span class="rm-val ${bc}">${fmtKbpsShort(kbps)}</span>` : '')
                + '</div>';
        }
        function renderRadioMetrics(s, clients) {
            const avgSNR = clients.length
                ? Math.round(clients.reduce((sum, c) => sum + ((c.signal || 0) - (c.noise || -95)), 0) / clients.length)
                : null;
            const nc = noiseClass(s.noise);
            const sc = snrClass(avgSNR);
            const bc = bitrateClass(s.bitrate);
            const nFill = s.noise != null ? Math.max(0, Math.min(100, (Math.abs(s.noise) - 50) / 50 * 100)).toFixed(1) : 0;
            const sFill = avgSNR != null ? Math.max(0, Math.min(100, avgSNR / 60 * 100)).toFixed(1) : 0;
            const bFill = s.bitrate ? Math.max(0, Math.min(100, s.bitrate / 1000 / 600 * 100)).toFixed(1) : 0;
            return `<div class="radio-metrics">
                <div class="radio-metric">
                    <div class="radio-metric-label">Channel</div>
                    <div class="radio-metric-value">${s.channel || '—'}</div>
                </div>
                <div class="radio-metric">
                    <div class="radio-metric-label">Noise Floor</div>
                    <div class="radio-metric-value ${nc}">${s.noise != null ? s.noise + ' dBm' : '—'}</div>
                    ${s.noise != null ? `<div class="radio-metric-bar"><div class="radio-metric-fill ${nc}" style="width:${nFill}%"></div></div>` : ''}
                </div>
                <div class="radio-metric">
                    <div class="radio-metric-label">Avg Client SNR</div>
                    <div class="radio-metric-value ${sc}">${avgSNR != null ? avgSNR + ' dB' : '—'}</div>
                    ${avgSNR != null ? `<div class="radio-metric-bar"><div class="radio-metric-fill ${sc}" style="width:${sFill}%"></div></div>` : ''}
                </div>
                <div class="radio-metric">
                    <div class="radio-metric-label">Radio Rate</div>
                    <div class="radio-metric-value ${bc}">${fmtKbps(s.bitrate)}</div>
                    ${s.bitrate ? `<div class="radio-metric-bar"><div class="radio-metric-fill ${bc}" style="width:${bFill}%"></div></div>` : ''}
                </div>
                <div class="radio-metric">
                    <div class="radio-metric-label">TX Power</div>
                    <div class="radio-metric-value">${s.txpower != null ? s.txpower + ' dBm' : '—'}</div>
                </div>
            </div>`;
        }

        function renderRouterRow(r, safeIP, isExpanded) {
            const online = r.online === 1;
            const reachHtml = renderReachStrip(reachData[r.ip], reachWindow);
            return `
                <div class="router-tr${online ? '' : ' offline'}${isExpanded ? ' expanded' : ''}"
                     id="router-row-${safeIP}"
                     data-router-ip="${r.ip}"
                     onclick="toggleRouter('${r.ip}')">
                    <div><span class="dot"></span></div>
                    <div class="hostname">${r.hostname || r.ip}</div>
                    <div class="bw-cell" id="bw-${safeIP}" title="${bwTitle(r.ip, r)}">${bwRows(r.ip, r)}</div>
                    <div class="cl-cell" id="cl-${safeIP}" title="${clTitle(r.ip, r)}">${clRow(r.ip, r)}</div>
                    <div class="rm24">${fmtRadioMini(r.ch_24, r.noise_24, r.bitrate_24)}</div>
                    <div class="rm5">${fmtRadioMini(r.ch_5, r.noise_5, r.bitrate_5)}</div>
                    <div class="ip" data-copy="${r.ip}" data-copy-label="IP">${r.ip}</div>
                    <div class="num cnt">${r.total_clients || 0}</div>
                    <div class="num b24">${r.clients_24 || 0}</div>
                    <div class="num b5">${r.clients_5 || 0}</div>
                    <div class="num load">${fmtLoad(r.load1)}</div>
                    <div class="upt">${fmtUptime(r.uptime)}</div>
                    <div id="reach-${safeIP}">${reachHtml}</div>
                    <div><i class="fas fa-chevron-right ch"></i></div>
                </div>
            `;
        }

        function renderRouters() {
            fetch('/api/routers')
                .then(res => res.json())
                .then(data => {
                    const routers = data.routers || [];
                    const table = document.getElementById('routersTable');

                    if (routers.length === 0) {
                        table.innerHTML = '<div class="no-clients" style="padding:30px">No routers configured. Please add routers in Settings.</div>';
                        return;
                    }

                    // Check if router list actually changed
                    const newRouterIPs = routers.map(r => r.ip).sort().join(',');
                    const oldRouterIPs = Object.keys(currentRouterData).sort().join(',');

                    // Store current data
                    routers.forEach(router => {
                        currentRouterData[router.ip] = router;
                    });

                    // Remove routers that no longer exist
                    Object.keys(currentRouterData).forEach(ip => {
                        if (!routers.find(r => r.ip === ip)) {
                            delete currentRouterData[ip];
                            expandedRouters.delete(ip);
                        }
                    });

                    // Full structural rebuild only if router set changed or
                    // we're rendering for the first time. Otherwise patch cells in place.
                    const hasHeader = table.querySelector('.router-th');
                    if (newRouterIPs !== oldRouterIPs || !hasHeader) {
                        let html = `
                            <div class="router-th">
                                <div></div>
                                <div>Hostname</div>
                                <div>Traffic ${bwWindowHours}h</div>
                                <div>Clients<span class="cl-key"><b class="k24"></b>2.4<b class="k5"></b>5</span></div>
                                <div>2.4G Radio</div>
                                <div>5G Radio</div>
                                <div>IP</div>
                                <div class="num">Clients</div>
                                <div class="num">2.4G</div>
                                <div class="num">5G</div>
                                <div class="num">Load</div>
                                <div>Uptime</div>
                                <div>Last 24h</div>
                                <div></div>
                            </div>
                        `;
                        routers.forEach(router => {
                            const safeIP = router.ip.replace(/\./g, '_');
                            const isExpanded = expandedRouters.has(router.ip);
                            html += renderRouterRow(router, safeIP, isExpanded);
                            html += `<div class="router-detail${isExpanded ? ' expanded' : ''}" id="router-detail-${safeIP}">
                                <div class="router-detail-inner"><div class="loading"><div class="spinner"></div>Loading interfaces...</div></div>
                            </div>`;
                        });
                        table.innerHTML = html;
                    } else {
                        routers.forEach(router => {
                            const safeIP = router.ip.replace(/\./g, '_');
                            const row = document.getElementById(`router-row-${safeIP}`);
                            if (!row) return;
                            const online = router.online === 1;
                            row.classList.toggle('offline', !online);
                            setText(row, '.hostname', router.hostname || router.ip);
                            setText(row, '.ip', router.ip);
                            setText(row, '.cnt', router.total_clients || 0);
                            setText(row, '.b24', router.clients_24 || 0);
                            setText(row, '.b5',  router.clients_5 || 0);
                            setText(row, '.load', fmtLoad(router.load1));
                            setText(row, '.upt',  fmtUptime(router.uptime));
                            const rm24 = row.querySelector('.rm24');
                            if (rm24) rm24.innerHTML = fmtRadioMini(router.ch_24, router.noise_24, router.bitrate_24);
                            const rm5 = row.querySelector('.rm5');
                            if (rm5)  rm5.innerHTML  = fmtRadioMini(router.ch_5,  router.noise_5,  router.bitrate_5);
                            // Only the live numbers move on the 10s poll — the
                            // sparklines are rebuilt by fetchBandwidth() once
                            // per bucket, so 240-point SVGs aren't re-serialised
                            // six times a minute.
                            setText(row, '.bw-row.in .bw-v',  fmtBpsLabel(liveBps(router, 'bw_in_bps')));
                            setText(row, '.bw-row.out .bw-v', fmtBpsLabel(liveBps(router, 'bw_out_bps')));
                            setText(row, '.cl-v', router.total_clients || 0);
                            const bwCell = row.querySelector('.bw-cell');
                            if (bwCell) bwCell.title = bwTitle(router.ip, router);
                            const clCell = row.querySelector('.cl-cell');
                            if (clCell) clCell.title = clTitle(router.ip, router);
                        });
                    }

                    // Load interface details for expanded routers
                    routers.forEach(router => {
                        if (expandedRouters.has(router.ip)) {
                            loadRouterDetails(router.ip);
                        }
                    });
                })
                .catch(err => {
                    console.error('Error fetching routers:', err);
                });
        }

        function loadRouterDetails(routerIp) {
            const safeIP = routerIp.replace(/\./g, '_');
            
            fetch(`/api/router/${routerIp}`)
                .then(res => res.json())
                .then(data => {
                    const ssids = data.ssids || [];
                    const container = document.getElementById(`router-detail-${safeIP}`);

                    if (!container) return; // Router was removed

                    if (ssids.length === 0) {
                        container.innerHTML = '<div class="router-detail-inner"><div class="no-clients">No wireless interfaces found</div></div>';
                        return;
                    }

                    container.innerHTML = `
                        <div class="router-detail-inner">
                        <div class="interfaces-list">
                            ${ssids.map(s => {
                                const badge = s.disabled
                                    ? '<span class="ssid-badge disabled">Disabled</span>'
                                    : (s.active
                                        ? '<span class="ssid-badge active">Active</span>'
                                        : '');
                                const bandCls = s.frequency
                                    ? (s.frequency >= 5000 ? ' band-5-card' : (s.frequency < 3000 ? ' band-24-card' : ''))
                                    : '';
                                const cardCls = ((s.disabled || !s.active) ? 'interface-card disabled-card' : 'interface-card') + bandCls;
                                const ifaceLabel = s.interface
                                    ? `${s.interface} · ${s.radio || ''}`
                                    : (s.radio || '');
                                const ssidName = s.ssid || 'Hidden SSID';

                                if (!s.active) {
                                    // Disabled (or configured-but-not-broadcasting) — compact card, no client table.
                                    return `
                                        <div class="${cardCls}">
                                            <div class="interface-header">
                                                <div>
                                                    <div class="interface-ssid">${ssidName}${badge}</div>
                                                    <div class="interface-name">${ifaceLabel}</div>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }

                                const clients = s.clients || [];
                                return `
                                    <div class="${cardCls}">
                                        <div class="interface-header">
                                            <div>
                                                <div class="interface-ssid">${ssidName}${badge}</div>
                                                <div class="interface-name">${ifaceLabel}</div>
                                            </div>
                                            <div style="text-align: right; font-size: 11px; color: var(--fg-muted);">
                                                <div><strong>${s.num_clients || 0}</strong> clients</div>
                                            </div>
                                        </div>
                                        <div class="interface-meta">
                                            <span><i class="fas fa-signal"></i> ${s.frequency ? (s.frequency / 1000).toFixed(1) + ' GHz' : 'N/A'}</span>
                                            <span><i class="fas fa-arrows-alt-h"></i> ${s.bandwidth || 'N/A'} MHz</span>
                                            <span><i class="fas fa-broadcast-tower"></i> Ch ${s.channel || 'N/A'}</span>
                                            <span><i class="fas fa-lock"></i> ${s.encryption || 'Open'}</span>
                                        </div>
                                        ${renderRadioMetrics(s, clients)}
                                        ${(clients.length > 0) ? `
                                            <table class="clients-table">
                                                <thead>
                                                    <tr>
                                                        <th>MAC Address</th>
                                                        <th>IP / Device</th>
                                                        <th>Active Voucher</th>
                                                        <th>Signal</th>
                                                        <th>RX Rate</th>
                                                        <th>TX Rate</th>
                                                        <th>RX/TX Data</th>
                                                        <th>Connected</th>
                                                        <th>Inactive</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    ${clients
                                                        .sort((a, b) => a.mac.localeCompare(b.mac))
                                                        .map(client => {
                                                            const signalPercent = getSignalPercent(client.signal);
                                                            const signalClass = getSignalClass(client.signal);
                                                            const ip = client.arp_ip || '';
                                                            const hostname = client.arp_hostname || '';
                                                            const ipCell = ip
                                                              ? (hostname
                                                                  ? `<div style="font-weight:600">${hostname}</div><div style="color:var(--fg-muted);font-size:0.85em" data-copy="${ip}" data-copy-label="IP">${ip}</div>`
                                                                  : `<span data-copy="${ip}" data-copy-label="IP">${ip}</span>`)
                                                              : '<span style="color:var(--fg-muted)">—</span>';

                                                            return `
                                                                <tr>
                                                                    <td class="mac-address" data-copy="${client.mac}" data-copy-label="MAC">
                                                                        ${client.mac}
                                                                    </td>
                                                                    <td class="mac-address">${ipCell}</td>
                                                                    <td>${voucherCell(client)}</td>
                                                                    <td>
                                                                        <div class="signal-bar">
                                                                            <div class="signal-fill ${signalClass}" style="width: ${signalPercent}%"></div>
                                                                        </div>
                                                                        ${client.signal} dBm
                                                                    </td>
                                                                    <td class="rate">${formatRate(client.rx_rate)}</td>
                                                                    <td class="rate">${formatRate(client.tx_rate)}</td>
                                                                    <td class="rate">${formatBytes(client.rx_bytes)} / ${formatBytes(client.tx_bytes)}</td>
                                                                    <td>${formatTime(client.connected_time)}</td>
                                                                    <td>${client.inactive ? client.inactive + 's' : 'Active'}</td>
                                                                </tr>
                                                            `;
                                                        }).join('')}
                                                </tbody>
                                            </table>
                                        ` : '<div class="no-clients">No clients connected</div>'}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        </div>
                    `;
                })
                .catch(err => {
                    console.error(`Error fetching details for ${routerIp}:`, err);
                    const safeIP = routerIp.replace(/\./g, '_');
                    const container = document.getElementById(`router-detail-${safeIP}`);
                    if (container) {
                        container.innerHTML = '<div class="router-detail-inner"><div class="no-clients">Error loading interface data</div></div>';
                    }
                });
        }

        function updateStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalRouters').textContent = data.routers.total || 0;
                    document.getElementById('onlineRouters').textContent = data.routers.online || 0;
                    document.getElementById('totalInterfaces').textContent = data.total_interfaces || 0;
                    document.getElementById('totalClients').textContent = data.clients_total || 0;
                    document.getElementById('clients24').textContent = data.clients_by_band['2.4GHz'] || 0;
                    document.getElementById('clients5').textContent = data.clients_by_band['5GHz'] || 0;

                    // Live counts for the SSID legend, and the second source
                    // of SSID names (see ssidTrack).
                    ssidLive = data.clients_by_ssid || {};
                    // A changed set shifts the colour assignment, so the
                    // graph has to be repainted with it, not just the legend.
                    if (ssidTrack(Object.keys(ssidLive))) renderSsidGraph();
                    renderSsidLegend();

                    
                    const now = new Date();
                    document.getElementById('lastUpdate').textContent = 
                        `Last update: ${now.toLocaleTimeString()}`;
                })
                .catch(err => console.error('Error fetching stats:', err));
        }

        // Initial load — both slow datasets first, so the strips and
        // sparklines are populated on the very first row render.
        Promise.all([fetchReachability(), fetchBandwidth()]).then(renderRouters);
        updateStats();
        fetchSsidClients();

        // Auto-refresh every 10 seconds
        setInterval(() => {
            renderRouters();
            updateStats();
        }, 10000);
        // Reachability changes slowly — refresh every 5 minutes.
        setInterval(fetchReachability, 5 * 60 * 1000);
        // The history gains one point per bucket (360s by default), so there
        // is nothing new to fetch more often than that. Chained rather than
        // setInterval so the cadence follows whatever bucket length the API
        // reports — changing `bandwidth_interval` can't leave the browser
        // re-serialising 240-point SVGs several times per bucket.
        (function scheduleBandwidth() {
            setTimeout(() => {
                fetchBandwidth().finally(scheduleBandwidth);
            }, Math.max(30, bwIntervalSec) * 1000);
        })();
        // The SSID graph is on its own, finer bucket, so it gets its own
        // chain rather than riding the bandwidth one — at 120s vs 360s,
        // sharing would either stale the SSID card by two buckets or
        // re-serialise every router's sparkline three times per bucket.
        (function scheduleSsid() {
            setTimeout(() => {
                fetchSsidClients().finally(scheduleSsid);
            }, Math.max(30, ssidIntervalSec) * 1000);
        })();
    </script>
    <script src="/static/copy-utils.js"></script>
    <script src="/static/theme.js"></script>
</body>
</html>
