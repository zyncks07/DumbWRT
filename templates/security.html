<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security - OpenWrt Monitor</title>
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/theme.css">
    <script>(function(){try{var t=localStorage.getItem('theme');var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'))}catch(e){}})();</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 100%);
            color: var(--fg);
            padding: 15px;
            min-height: 100vh;
            font-size: 13px;
        }

        .container { max-width: 1800px; margin: 0 auto; }

        .header {
            background: var(--card-bg);
            border: 1px solid var(--border-a);
            border-radius: 10px;
            padding: 15px 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-b);
            color: var(--fg);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-0);
        }

        .sec-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 15px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .sec-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-a);
            border-radius: 10px;
            padding: 20px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-c);
        }

        .field-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .form-input {
            background: var(--card-bg-3);
            border: 2px solid var(--border-a);
            border-radius: 6px;
            padding: 9px 12px;
            color: var(--fg);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* IP list */
        .ip-list { margin: 10px 0; }

        .ip-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: var(--card-bg-3);
            border: 1px solid var(--border-c);
        }

        .ip-row.is-self {
            border-color: var(--accent);
            background: var(--border-c);
        }

        .ip-addr {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--fg);
        }

        .ip-row.is-self .ip-addr { color: var(--accent); }

        .self-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--accent);
            color: var(--bg-0);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .btn-remove {
            background: transparent;
            border: 1px solid transparent;
            color: var(--fg-muted);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-remove:hover {
            background: rgba(255,71,87,0.15);
            border-color: rgba(255,71,87,0.3);
            color: var(--err);
        }

        .ip-empty {
            color: var(--fg-muted);
            font-size: 12px;
            padding: 10px 0;
            text-align: center;
        }

        /* Your IP row */
        .your-ip-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--border-c);
            border: 1px solid var(--border-b);
            border-radius: 6px;
            margin-bottom: 14px;
        }

        .your-ip-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .your-ip-val {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--accent);
            flex: 1;
        }

        .btn-add-self {
            background: rgba(0,255,136,0.15);
            border: 1px solid rgba(0,255,136,0.3);
            color: var(--accent-2);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-add-self:hover { background: var(--accent-2); color: var(--bg-0); }
        .btn-add-self:disabled { opacity: 0.4; cursor: default; }

        /* Add IP form */
        .add-ip-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .add-ip-form .form-input { flex: 1; }

        .btn-add-ip {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            color: var(--accent);
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-add-ip:hover { background: var(--accent); color: var(--bg-0); }

        /* Warn box */
        .warn-box {
            background: rgba(255,184,0,0.1);
            border: 1px solid rgba(255,184,0,0.25);
            border-radius: 6px;
            padding: 9px 12px;
            font-size: 11px;
            color: var(--warn);
            margin-top: 12px;
            display: flex;
            gap: 7px;
            align-items: flex-start;
            line-height: 1.5;
        }

        /* Save button */
        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none;
            color: var(--bg-0);
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-save:hover { box-shadow: 0 4px 16px rgba(0,212,255,0.35); }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        /* Alerts */
        .alert {
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .alert-ok  { background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.3); color: var(--accent-2); }
        .alert-err { background: rgba(255,71,87,0.15);  border: 1px solid rgba(255,71,87,0.3);  color: var(--err); }

        /* Events table */
        .events-wrap {
            overflow-x: auto;
            margin-top: 0;
        }

        .events-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .events-table th {
            text-align: left;
            padding: 8px 10px;
            font-size: 10px;
            font-weight: 600;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-b);
        }

        .events-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-c);
            vertical-align: middle;
        }

        .events-table tbody tr:last-child td { border-bottom: none; }
        .events-table tbody tr:hover td { background: var(--border-c); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-ok      { background: rgba(0,255,136,0.15); color: var(--accent-2); border: 1px solid rgba(0,255,136,0.3); }
        .badge-err     { background: rgba(255,71,87,0.15);  color: var(--err);      border: 1px solid rgba(255,71,87,0.3); }
        .badge-warn    { background: rgba(255,184,0,0.15);  color: var(--warn);     border: 1px solid rgba(255,184,0,0.3); }

        .mono { font-family: 'Courier New', monospace; }

        .empty-msg {
            text-align: center;
            color: var(--fg-muted);
            padding: 30px 0;
            font-size: 12px;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .ml-auto { margin-left: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> Security</h1>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <a href="/dashboard" class="btn"><i class="fas fa-gauge-high"></i> Dashboard</a>
                <a href="/clients" class="btn"><i class="fas fa-users"></i> Clients</a>
                <a href="/logs" class="btn"><i class="fas fa-terminal"></i> Logs</a>
                <a href="/config" class="btn"><i class="fas fa-cog"></i> Settings</a>
                <a href="/maintenance" class="btn"><i class="fas fa-database"></i> Maintenance</a>
                <button id="themeToggle" class="btn" title="Toggle theme" aria-label="Toggle theme"></button>
                <a href="/logout" class="btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <div class="sec-grid">

            <!-- ── IP Whitelist ───────────────────────────────────────── -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-list-check"></i>
                    IP Whitelist
                </div>

                <!-- Your current IP -->
                <div class="your-ip-row">
                    <span class="your-ip-label">Your IP</span>
                    <span class="your-ip-val mono" id="clientIpVal">—</span>
                    <button class="btn-add-self" id="addSelfBtn" onclick="addCurrentIp()" disabled>
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>

                <!-- Allowed IP list -->
                <label class="field-label">Allowed IPs</label>
                <div class="ip-list" id="ipList">
                    <div class="empty-msg">Loading…</div>
                </div>

                <!-- Add new IP -->
                <div class="add-ip-form">
                    <input type="text" id="newIpInput" class="form-input"
                           placeholder="192.168.x.x"
                           autocomplete="off"
                           onkeydown="if(event.key==='Enter')addNewIp()">
                    <button class="btn-add-ip" onclick="addNewIp()">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>

                <div class="warn-box">
                    <i class="fas fa-triangle-exclamation"></i>
                    <span>Empty list = <strong>all IPs allowed</strong> (failsafe — you cannot lock yourself out by clearing the list).</span>
                </div>

                <button class="btn-save" id="saveBtn" onclick="saveWhitelist()">
                    <i class="fas fa-floppy-disk"></i> Save Whitelist
                </button>

                <div class="alert alert-ok"  id="saveOk"  style="display:none;"><i class="fas fa-circle-check"></i> Whitelist saved.</div>
                <div class="alert alert-err" id="saveErr" style="display:none;"><i class="fas fa-circle-exclamation"></i> <span id="saveErrText"></span></div>
            </div>

            <!-- ── Login Activity ─────────────────────────────────────── -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-clock-rotate-left"></i>
                    Login Activity
                    <span style="font-size:10px; color:var(--fg-muted); font-weight:400; margin-left:4px;" id="eventCount"></span>
                    <button class="btn ml-auto" onclick="loadEvents()" id="refreshBtn">
                        <i class="fas fa-rotate"></i> Refresh
                    </button>
                </div>

                <div class="events-wrap">
                    <table class="events-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Status</th>
                                <th>User</th>
                                <th>Source IP</th>
                            </tr>
                        </thead>
                        <tbody id="eventsBody">
                            <tr><td colspan="4" class="empty-msg">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div><!-- .sec-grid -->
    </div>

    <script>
        let allowedIps = [];
        let clientIp = '';

        function esc(s) {
            return String(s)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        async function init() {
            await Promise.all([loadClientIp(), loadWhitelist(), loadEvents()]);
        }

        async function loadClientIp() {
            try {
                const r = await fetch('/api/client-ip');
                const d = await r.json();
                if (d.success) {
                    clientIp = d.ip;
                    document.getElementById('clientIpVal').textContent = d.ip;
                    updateAddSelfBtn();
                }
            } catch(e) {
                document.getElementById('clientIpVal').textContent = 'unavailable';
            }
        }

        async function loadWhitelist() {
            try {
                const r = await fetch('/api/security/whitelist');
                const d = await r.json();
                if (d.success) {
                    allowedIps = d.allowed_ips || [];
                    renderIpList();
                    updateAddSelfBtn();
                }
            } catch(e) {
                document.getElementById('ipList').innerHTML = '<div class="empty-msg">Failed to load.</div>';
            }
        }

        function updateAddSelfBtn() {
            const btn = document.getElementById('addSelfBtn');
            if (!clientIp) { btn.disabled = true; return; }
            btn.disabled = allowedIps.includes(clientIp);
        }

        function renderIpList() {
            const el = document.getElementById('ipList');
            if (!allowedIps.length) {
                el.innerHTML = '<div class="empty-msg" style="padding:12px 0;">No IPs configured — all connections allowed.</div>';
                return;
            }
            el.innerHTML = allowedIps.map((ip, i) => {
                const isSelf = ip === clientIp;
                return `<div class="ip-row${isSelf ? ' is-self' : ''}">
                    <span class="ip-addr mono">${esc(ip)}</span>
                    ${isSelf ? '<span class="self-badge">you</span>' : ''}
                    <button class="btn-remove" onclick="removeIp(${i})" title="Remove">
                        <i class="fas fa-times"></i>
                    </button>
                </div>`;
            }).join('');
        }

        function addCurrentIp() {
            if (!clientIp || allowedIps.includes(clientIp)) return;
            allowedIps.push(clientIp);
            renderIpList();
            updateAddSelfBtn();
        }

        function addNewIp() {
            const inp = document.getElementById('newIpInput');
            const val = inp.value.trim();
            if (!val) return;
            if (!allowedIps.includes(val)) {
                allowedIps.push(val);
                renderIpList();
                updateAddSelfBtn();
            }
            inp.value = '';
            inp.focus();
        }

        function removeIp(i) {
            allowedIps.splice(i, 1);
            renderIpList();
            updateAddSelfBtn();
        }

        async function saveWhitelist() {
            const btn  = document.getElementById('saveBtn');
            const ok   = document.getElementById('saveOk');
            const err  = document.getElementById('saveErr');
            ok.style.display = 'none';
            err.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Saving…';
            try {
                const r = await fetch('/api/security/whitelist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ allowed_ips: allowedIps })
                });
                const d = await r.json();
                if (r.ok && d.success) {
                    ok.style.display = 'flex';
                    setTimeout(() => ok.style.display = 'none', 3000);
                } else {
                    throw new Error(d.error || 'Save failed');
                }
            } catch(e) {
                document.getElementById('saveErrText').textContent = e.message;
                err.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-floppy-disk"></i> Save Whitelist';
            }
        }

        async function loadEvents() {
            const tbody = document.getElementById('eventsBody');
            const rBtn  = document.getElementById('refreshBtn');
            const cnt   = document.getElementById('eventCount');
            rBtn.disabled = true;
            tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">Loading…</td></tr>';
            try {
                const r = await fetch('/api/security/login-events');
                const d = await r.json();
                if (!d.success) throw new Error(d.error);
                const events = d.events || [];
                cnt.textContent = events.length ? `(${events.length} events)` : '';
                if (!events.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">No login events recorded yet. Events appear after the first login attempt.</td></tr>';
                    return;
                }
                tbody.innerHTML = events.map(e => {
                    const badge =
                        e.kind === 'success'   ? '<span class="badge badge-ok"><i class="fas fa-check"></i> Login</span>'
                      : e.kind === 'ratelimit' ? '<span class="badge badge-warn"><i class="fas fa-clock"></i> Rate Limited</span>'
                      :                          '<span class="badge badge-err"><i class="fas fa-times"></i> Failed</span>';
                    return `<tr>
                        <td class="mono" style="white-space:nowrap;">${esc(fmtTs(e.ts))}</td>
                        <td>${badge}</td>
                        <td class="mono">${esc(e.user)}</td>
                        <td class="mono">${esc(e.ip)}</td>
                    </tr>`;
                }).join('');
            } catch(e) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-msg" style="color:var(--err);">Error: ${esc(e.message)}</td></tr>`;
            } finally {
                rBtn.disabled = false;
            }
        }

        function fmtTs(ts) {
            try {
                const d = new Date(ts);
                if (isNaN(d)) return ts.substring(0, 19).replace('T', ' ');
                const date = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
                const time = d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
                return `${date} ${time}`;
            } catch(e) { return ts || ''; }
        }

        init();
    </script>
    <script src="/static/theme.js"></script>
</body>
</html>
